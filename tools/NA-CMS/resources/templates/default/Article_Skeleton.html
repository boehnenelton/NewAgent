<article>
    <!-- BEHTML: article-header meta row quantized to 1*Ry regardless of
         font metrics (see behtml.css .article-meta). -->
    <header class="article-header" data-behtml-y="0" data-behtml-x="0..7">
        <div class="article-meta">{{category}} &bull; {{timestamp}}</div>
        <h1 class="article-title">{{article_title}}</h1>
    </header>
    {{featured_image_html}}
    <div class="article-body">{{article_body}}</div>
    
    {{related_content_section}}
</article>
